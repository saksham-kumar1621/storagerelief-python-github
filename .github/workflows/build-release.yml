name: Build & Release StorageRelief

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Run Release Build Script
      run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StorageRelief-Windows-Release
        path: |
          StorageRelief.exe
          StorageRelief_Setup.exe
