name: Build & Release StorageRelief

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test_and_build:
    name: Test, Package & Release Windows Binaries
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Automated Test Suite
      run: python -m unittest discover -s tests -p "test_*.py" -v

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Run Release Build Script
      run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StorageRelief-Windows-Release
        path: |
          StorageRelief.exe
          StorageRelief_Setup.exe

    - name: Publish to GitHub Releases
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          StorageRelief.exe
          StorageRelief_Setup.exe
        draft: false
        prerelease: false
        generate_release_notes: true
